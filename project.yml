# XcodeGen project specification - generates DemoApp.xcodeproj deterministically.
# Used by the CI workflow when the repository has no checked-in .xcodeproj.
# Bundle id intentionally namespaced; change in your real project.
name: DemoApp
options:
  bundleIdPrefix: com.signalproofai
  deploymentTarget:
    iOS: "17.0"
targets:
  DemoApp:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.signalproofai.demoapp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: "NO"
